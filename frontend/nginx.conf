# F0-2/docs/07 §3: proxy de /api e /storage, SPA fallback, cabecalhos basicos
# de seguranca (vibe-security) e cache longo so para os assets versionados do
# build do Vite.

# F9: pool de conexoes keepalive para o backend (evita 1 conexao TCP nova por
# requisicao sob carga continua, que esgota portas efemeras / TIME_WAIT).
upstream backend_api {
  server backend:8080;
  keepalive 32;                          # valor pequeno; suba se a carga exigir
}

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 30m;              # ate 5 fotos de 5 MB por requisicao

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /api/ {
    proxy_pass http://backend_api;        # upstream com keepalive
    proxy_http_version 1.1;
    proxy_set_header Connection "";       # exigido para reuso de conexao keepalive
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /storage/ {                    # URLs pre-assinadas das fotos (D-41)
    proxy_pass http://s3:7070/;           # remove o prefixo /storage
    proxy_set_header Host s3:7070;        # a assinatura S3 cobre o Host usado ao assinar
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri /index.html;           # rotas do React Router
  }
}
